name: Deploy NestJS to VM

# Trigger on push to main, or run manually from the Actions tab
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent overlapping deployments from stacking up
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # - name: Lint (optional - remove if you don't lint)
      #   run: npm run lint --if-present

      # - name: Run tests (optional - remove if you don't want CI to block on tests)
      #   run: npm test --if-present

      - name: Build NestJS app
        run: npm run build

      - name: Package build output
        run: |
          mkdir -p deploy-package
          cp -r dist deploy-package/
          cp package.json deploy-package/
          cp package-lock.json deploy-package/
          # Include this only if you use PM2 with an ecosystem file
          if [ -f ecosystem.config.js ]; then cp ecosystem.config.js deploy-package/; fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: deploy-package
          retention-days: 1

  deploy:
    name: Deploy to VM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: deploy-package

      - name: Add VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy build files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'deploy-package/*'
          target: '/home/${{ secrets.VPS_USER }}/app-releases/latest'
          strip_components: 1
          overwrite: true

      # ------------------------------------------------------------------
      # Add/remove lines below to match YOUR actual environment variables.
      # Every value here must exist as a GitHub Secret in this repo.
      # ------------------------------------------------------------------
      - name: Deploy & restart app on VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEROTIX_BASE_URL: ${{ secrets.NEROTIX_BASE_URL }}
          NEROTIX_TOKEN: ${{ secrets.NEROTIX_TOKEN }}
          PORT: ${{ secrets.PORT }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DATABASE_URL,JWT_SECRET,NEROTIX_BASE_URL,NEROTIX_TOKEN,PORT,RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET,RAZORPAY_WEBHOOK_SECRET,SMTP_FROM,SMTP_HOST,SMTP_PASS,SMTP_PORT,SMTP_USER
          script: |
            set -e

            # ------------------------------------------------------------
            # Ensure Node.js 22 is installed (idempotent - skips if present)
            # ------------------------------------------------------------
            if ! command -v node > /dev/null || [ "$(node -v | cut -d. -f1 | tr -d v)" -lt 22 ]; then
              echo "Installing Node.js 22..."
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
            else
              echo "Node.js $(node -v) already installed."
            fi

            # ------------------------------------------------------------
            # Ensure PM2 is installed globally (idempotent - skips if present)
            # ------------------------------------------------------------
            if ! command -v pm2 > /dev/null; then
              echo "Installing PM2..."
              sudo npm install -g pm2
            else
              echo "PM2 already installed."
            fi

            APP_DIR="/home/${{ secrets.VPS_USER }}/app-releases/latest"
            cd "$APP_DIR"

            echo "Writing .env file..."
            cat > .env << EOF
            NODE_ENV=production
            PORT=${PORT}
            DATABASE_URL=${DATABASE_URL}
            JWT_SECRET=${JWT_SECRET}
            NEROTIX_BASE_URL=${NEROTIX_BASE_URL}
            NEROTIX_TOKEN=${NEROTIX_TOKEN}
            RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
            RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
            RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
            SMTP_FROM=${SMTP_FROM}
            SMTP_HOST=${SMTP_HOST}
            SMTP_PASS=${SMTP_PASS}
            SMTP_PORT=${SMTP_PORT}
            SMTP_USER=${SMTP_USER}
            EOF

            echo "Installing production dependencies..."
            npm ci --omit=dev

            echo "Restarting app with PM2..."
            if pm2 describe nestjs-app > /dev/null 2>&1; then
              pm2 reload nestjs-app --update-env
            else
              pm2 start dist/main.js --name nestjs-app
            fi

            pm2 save

            echo "Deployment complete."